<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monte Carlo standard error</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:#303338;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:12px 1px}h1{font-size:23px;font-weight:600;letter-spacing:-.025em;margin:0 0 10px}.model{font-size:14px;color:#626a5d;margin:0 0 12px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#5b6159}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:23px;height:0;border-top:3px solid #70944d;display:inline-block}.legend .target{border-top:2px dashed #59625b}.legend .interval{border-color:#a77441}svg{display:block;width:100%;max-width:480px;height:auto;margin:8px auto 12px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid #e4e7e1;padding-top:14px}.slider{display:grid;grid-template-columns:44px minmax(90px,1fr) 44px;align-items:center;gap:10px;width:100%}input[type=range]{width:100%;accent-color:#70944d;min-height:36px;margin:0}output{font-variant-numeric:tabular-nums;text-align:right}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #cfd6c8;padding:7px 10px;border-radius:0;min-height:40px;max-width:100%}button{cursor:pointer}button:hover{background:#f3f6ef}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #73924f;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid #e4e7e1;margin:16px 0 0;padding:14px 0 0}.stats dt{color:#6b7265;font-size:12px}.stats dd{margin:4px 0 0;font-variant-numeric:tabular-nums;font-size:20px;overflow-wrap:anywhere}.seed{font-size:12px;color:#6b7265;margin-left:auto}.matrix-line{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;font-size:14px}.matrix{border-left:1px solid #919a8a;border-right:1px solid #919a8a;border-collapse:collapse;font-variant-numeric:tabular-nums}.matrix td{padding:1px 9px;text-align:right}.mini-heading{font-size:12px;color:#6b7265;margin:4px 0 0}.interval-value{font-size:17px!important}@media(min-width:600px){.controls .slider{flex:1 1 180px;width:auto}.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){h1{font-size:21px}.legend{gap:12px;font-size:12px}button,select{font-size:14px}.stats dd{font-size:18px}}</style></head><body><main>
<h1>Monte Carlo standard error</h1>
<p class="model">계산 가능한 예시 · Z ~ N(0, 1), f(z) = z² · E[f(Z)] = 1</p>
<div class="legend"><span><i></i>표본평균</span><span><i class="target"></i>정확한 값 1</span><span><i class="interval"></i>현재 근사 95% 구간</span></div>
<svg id="plot" viewBox="0 0 480 300" role="img" aria-label="표본 수에 따른 제곱값 평균과 현재의 근사 신뢰구간"></svg>
<div class="controls"><label for="count">표본 수 S</label><select id="count"><option>10</option><option>30</option><option selected>100</option><option>300</option><option>1000</option><option>3000</option><option>10000</option></select><button id="new-seed" type="button">다시 추출</button><button id="reset" type="button">초기화</button><span class="seed">Seed <output id="seed"></output></span></div>
<dl class="stats four" aria-live="polite"><div><dt>표본평균</dt><dd id="mean"></dd></div><div><dt>추정 MCSE · s_f / √S</dt><dd id="mcse"></dd></div><div><dt>이론 SE · √(2/S)</dt><dd id="theory"></dd></div><div><dt>근사 95% 구간</dt><dd id="interval" class="interval-value"></dd></div></dl>
<noscript>이 시연은 JavaScript가 필요합니다.</noscript>
</main><script type="module">
import { createMonteCarloSeSampler } from './sampling-kernel.mjs';
import { samplingSize, samplingNumber, samplingIndices, samplingPlot } from './sampling-plot.mjs';
const $=id=>document.getElementById(id);let seed=403,sampler=createMonteCarloSeSampler(seed);
function render(){
 const s=sampler.at(Number($('count').value));$('seed').textContent=seed;$('mean').textContent=samplingNumber(s.mean);$('mcse').textContent=samplingNumber(s.mcse);$('theory').textContent=samplingNumber(s.theoreticalSe);$('interval').textContent=`[${s.interval.map(x=>x.toFixed(3)).join(', ')}]`;
 const low=Math.min(1,s.interval[0],...s.means),high=Math.max(1,s.interval[1],...s.means),pad=Math.max(.15,(high-low)*.12),ymin=low-pad,ymax=high+pad;
 samplingPlot($('plot'),{xmin:1,xmax:s.count,ymin,ymax,logX:true,xTicks:[1,10,100,1000,10000].filter(n=>n<=s.count),yTicks:Array.from({length:4},(_,i)=>ymin+(ymax-ymin)*i/3),series:[{values:samplingIndices(s.count,400,true).map(n=>[n,s.means[n-1]])}],references:[{value:1}],points:[[s.count,s.mean]],interval:{x:s.count,lower:s.interval[0],upper:s.interval[1]},xLabel:'S · 로그 눈금'});
 requestAnimationFrame(samplingSize);
}
$('count').addEventListener('change',render);$('new-seed').addEventListener('click',()=>{seed=(seed+1)>>>0;sampler=createMonteCarloSeSampler(seed);render();});$('reset').addEventListener('click',()=>{seed=403;sampler=createMonteCarloSeSampler(seed);$('count').value='100';render();});
new ResizeObserver(samplingSize).observe(document.querySelector('main'));
render();
</script></body></html>
