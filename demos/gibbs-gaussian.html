<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gibbs · conditional draws</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:#303338;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:12px 1px}h1{font-size:23px;font-weight:600;letter-spacing:-.025em;margin:0 0 10px}.model{font-size:14px;color:#626a5d;margin:0 0 12px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#5b6159}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:23px;height:0;border-top:3px solid #70944d;display:inline-block}.legend .target{border-top:2px dashed #59625b}.legend .interval{border-color:#a77441}svg{display:block;width:100%;max-width:480px;height:auto;margin:8px auto 12px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid #e4e7e1;padding-top:14px}.slider{display:grid;grid-template-columns:44px minmax(90px,1fr) 44px;align-items:center;gap:10px;width:100%}input[type=range]{width:100%;accent-color:#70944d;min-height:36px;margin:0}output{font-variant-numeric:tabular-nums;text-align:right}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #cfd6c8;padding:7px 10px;border-radius:0;min-height:40px;max-width:100%}button{cursor:pointer}button:hover{background:#f3f6ef}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #73924f;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid #e4e7e1;margin:16px 0 0;padding:14px 0 0}.stats dt{color:#6b7265;font-size:12px}.stats dd{margin:4px 0 0;font-variant-numeric:tabular-nums;font-size:20px;overflow-wrap:anywhere}.seed{font-size:12px;color:#6b7265;margin-left:auto}.matrix-line{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;font-size:14px}.matrix{border-left:1px solid #919a8a;border-right:1px solid #919a8a;border-collapse:collapse;font-variant-numeric:tabular-nums}.matrix td{padding:1px 9px;text-align:right}.mini-heading{font-size:12px;color:#6b7265;margin:4px 0 0}.interval-value{font-size:17px!important}@media(min-width:600px){.controls .slider{flex:1 1 180px;width:auto}.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){h1{font-size:21px}.legend{gap:12px;font-size:12px}button,select{font-size:14px}.stats dd{font-size:18px}}</style></head><body><main>
<h1>Gibbs · conditional draws</h1>
<p class="model">계산 가능한 예시 · 목표 N(0, Σ) · Σ = [[1, ρ], [ρ, 1]] · 초기 상태 (1, 1)</p>
<div class="legend"><span><i class="target"></i>목표 등밀도선</span><span><i></i>최근 100번 갱신</span><span><i class="interval"></i>다음 좌표의 이동선</span></div>
<svg id="plot" viewBox="0 0 480 360" role="img" aria-label="상관 Gaussian에서 조건부분포로 추출하는 Gibbs 좌표 경로"></svg>
<div class="controls"><div class="slider"><label for="rho">ρ</label><input id="rho" type="range" min="-0.95" max="0.95" step="0.05" value="0.8"><output id="rho-value" for="rho"></output></div><button id="step" type="button">z₁ 추출</button><button id="sweep" type="button">두 좌표 추출</button><button id="reset" type="button">초기화</button><button id="new-seed" type="button">새 seed</button><span class="seed">Seed <output id="seed"></output></span></div>
<dl class="stats four" aria-live="polite"><div><dt>현재 상태 (z₁, z₂)</dt><dd id="state"></dd></div><div><dt>다음 조건부 평균</dt><dd id="conditional-mean"></dd></div><div><dt>조건부 표준편차</dt><dd id="conditional-sd"></dd></div><div><dt>좌표 갱신 횟수</dt><dd id="count"></dd></div></dl>
<noscript>이 시연은 JavaScript가 필요합니다.</noscript>
</main><script type="module">
import { createGibbsSampler } from './sampling-kernel.mjs';
import { gaussianEllipse } from './vi-gaussian-kernel.mjs';
import { samplingSize, samplingNumber } from './sampling-plot.mjs';
const $=id=>document.getElementById(id);let rho=.8,seed=411,updates=0,sampler=createGibbsSampler({rho,seed});
function restart(){updates=0;sampler=createGibbsSampler({rho,seed});render();}
function render(){
 const s=sampler.at(updates);$('rho-value').textContent=rho.toFixed(2);$('seed').textContent=seed;$('state').textContent=`(${s.state.map(x=>x.toFixed(3)).join(', ')})`;$('conditional-mean').textContent=samplingNumber(s.conditionalMean);$('conditional-sd').textContent=samplingNumber(s.conditionalSd);$('count').textContent=updates;$('step').textContent=s.nextCoordinate===0?'z₁ 추출':'z₂ 추출';
 const path=s.states.slice(-101),bound=Math.max(3,Math.ceil(Math.max(...path.flat().map(Math.abs))+.25)),sx=x=>240+150*x/bound,sy=y=>175-150*y/bound,ticks=[-bound,-bound/2,0,bound/2,bound];
 let marks=ticks.map(t=>`<line x1="90" x2="390" y1="${sy(t)}" y2="${sy(t)}" stroke="#edf0e9"/><line x1="${sx(t)}" x2="${sx(t)}" y1="25" y2="325" stroke="#edf0e9"/><text x="${sx(t)}" y="347" text-anchor="middle">${t}</text><text x="77" y="${sy(t)+6}" text-anchor="end">${t}</text>`).join('');
 marks+=[1,2].map(radius=>`<path d="${gaussianEllipse([[1,rho],[rho,1]],[0,0],radius).map(([x,y],i)=>`${i?'L':'M'}${sx(x)},${sy(y)}`).join(' ')}" fill="none" stroke="#59625b" stroke-width="2" stroke-dasharray="7 5"/>`).join('');
 marks+=s.nextCoordinate===0?`<line x1="90" x2="390" y1="${sy(s.state[1])}" y2="${sy(s.state[1])}" stroke="#a77441" stroke-dasharray="3 5"/>`:`<line x1="${sx(s.state[0])}" x2="${sx(s.state[0])}" y1="25" y2="325" stroke="#a77441" stroke-dasharray="3 5"/>`;
 marks+=`<polyline points="${path.map(([x,y])=>`${sx(x)},${sy(y)}`).join(' ')}" fill="none" stroke="#70944d" stroke-width="2"/><circle cx="${sx(s.state[0])}" cy="${sy(s.state[1])}" r="5" fill="#52723c"/><text x="411" y="347">z₁</text><text x="75" y="17">z₂</text>`;
 $('plot').innerHTML=`<g font-family="sans-serif" font-size="17" fill="#60665c">${marks}</g>`;requestAnimationFrame(samplingSize);
}
$('rho').addEventListener('input',()=>{rho=Number($('rho').value);restart();});$('step').addEventListener('click',()=>{updates++;render();});$('sweep').addEventListener('click',()=>{updates+=2;render();});$('reset').addEventListener('click',restart);$('new-seed').addEventListener('click',()=>{seed=(seed+1)>>>0;restart();});
new ResizeObserver(samplingSize).observe(document.querySelector('main'));
render();
</script></body></html>
