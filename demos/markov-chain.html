<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Distribution through a Markov chain</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:#303338;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:12px 1px}h1{font-size:23px;font-weight:600;letter-spacing:-.025em;margin:0 0 10px}.model{font-size:14px;color:#626a5d;margin:0 0 12px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#5b6159}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:23px;height:0;border-top:3px solid #70944d;display:inline-block}.legend .target{border-top:2px dashed #59625b}.legend .interval{border-color:#a77441}svg{display:block;width:100%;max-width:480px;height:auto;margin:8px auto 12px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid #e4e7e1;padding-top:14px}.slider{display:grid;grid-template-columns:44px minmax(90px,1fr) 44px;align-items:center;gap:10px;width:100%}input[type=range]{width:100%;accent-color:#70944d;min-height:36px;margin:0}output{font-variant-numeric:tabular-nums;text-align:right}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #cfd6c8;padding:7px 10px;border-radius:0;min-height:40px;max-width:100%}button{cursor:pointer}button:hover{background:#f3f6ef}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #73924f;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid #e4e7e1;margin:16px 0 0;padding:14px 0 0}.stats dt{color:#6b7265;font-size:12px}.stats dd{margin:4px 0 0;font-variant-numeric:tabular-nums;font-size:20px;overflow-wrap:anywhere}.seed{font-size:12px;color:#6b7265;margin-left:auto}.matrix-line{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;font-size:14px}.matrix{border-left:1px solid #919a8a;border-right:1px solid #919a8a;border-collapse:collapse;font-variant-numeric:tabular-nums}.matrix td{padding:1px 9px;text-align:right}.mini-heading{font-size:12px;color:#6b7265;margin:4px 0 0}.interval-value{font-size:17px!important}@media(min-width:600px){.controls .slider{flex:1 1 180px;width:auto}.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){h1{font-size:21px}.legend{gap:12px;font-size:12px}button,select{font-size:14px}.stats dd{font-size:18px}}</style></head><body><main>
<h1>Distribution through a Markov chain</h1>
<p class="model">μₜ = μ₀ Pᵗ · 행: 현재 상태, 열: 다음 상태</p>
<div class="matrix-line"><span>P =</span><table class="matrix" aria-label="전이행렬"><tbody id="matrix"></tbody></table></div>
<div class="legend"><span><i></i>Pₜ(상태 1)</span><span id="stationary-legend"><i class="target"></i>정상확률</span></div>
<svg id="plot" viewBox="0 0 480 270" role="img" aria-label="전이 횟수에 따른 첫 상태의 주변확률"></svg>
<div class="controls"><label for="preset">전이</label><select id="preset"><option value="source">원문 예제</option><option value="identity">항등 전이</option><option value="alternating">교대 전이</option></select><div class="slider"><label for="initial">μ₀(1)</label><input id="initial" type="range" min="0" max="1" step="0.05" value="1"><output id="initial-value" for="initial"></output></div><button id="step" type="button">한 단계</button><button id="ten" type="button">+10</button><button id="reset" type="button">초기화</button><span class="seed">t = <output id="time"></output></span></div>
<dl class="stats" aria-live="polite"><div><dt>현재 분포 · 상태 1, 2</dt><dd id="distribution"></dd></div><div><dt>정상분포</dt><dd id="stationary"></dd></div></dl>
<noscript>이 시연은 JavaScript가 필요합니다.</noscript>
</main><script type="module">
import { markovTrajectory } from './sampling-kernel.mjs';
import { samplingSize, samplingPlot } from './sampling-plot.mjs';
const $=id=>document.getElementById(id);let steps=0;
function render(){
 const s=markovTrajectory($('preset').value,Number($('initial').value),steps);$('initial-value').textContent=Number($('initial').value).toFixed(2);$('time').textContent=steps;
 $('matrix').innerHTML=s.matrix.map(row=>`<tr>${row.map(p=>`<td>${p.toFixed(2)}</td>`).join('')}</tr>`).join('');
 $('distribution').textContent=`(${s.distribution.map(p=>p.toFixed(3)).join(', ')})`;$('stationary').textContent=s.stationary?`(${s.stationary.map(p=>p.toFixed(2)).join(', ')})`:'모든 분포';$('stationary-legend').hidden=!s.stationary;
 const maximum=Math.max(20,steps);samplingPlot($('plot'),{xmin:0,xmax:maximum,ymin:0,ymax:1,xTicks:[0,maximum/2,maximum],yTicks:[0,.25,.5,.75,1],series:[{values:s.history.map((p,t)=>[t,p[0]])}],references:s.stationary?[{value:s.stationary[0]}]:[],points:[[steps,s.distribution[0]]],xLabel:'전이 횟수 t'});
 $('step').disabled=$('ten').disabled=steps>=1000;requestAnimationFrame(samplingSize);
}
$('preset').addEventListener('change',()=>{steps=0;render();});$('initial').addEventListener('input',()=>{steps=0;render();});$('step').addEventListener('click',()=>{steps=Math.min(1000,steps+1);render();});$('ten').addEventListener('click',()=>{steps=Math.min(1000,steps+10);render();});$('reset').addEventListener('click',()=>{steps=0;render();});
new ResizeObserver(samplingSize).observe(document.querySelector('main'));
render();
</script></body></html>
