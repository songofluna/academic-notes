<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autocorrelation and effective sample size</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:#303338;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:12px 1px}h1{font-size:23px;font-weight:600;letter-spacing:-.025em;margin:0 0 10px}.model{font-size:14px;color:#626a5d;margin:0 0 12px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#5b6159}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:23px;height:0;border-top:3px solid #70944d;display:inline-block}.legend .target{border-top:2px dashed #59625b}.legend .interval{border-color:#a77441}svg{display:block;width:100%;max-width:480px;height:auto;margin:8px auto 12px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid #e4e7e1;padding-top:14px}.slider{display:grid;grid-template-columns:44px minmax(90px,1fr) 44px;align-items:center;gap:10px;width:100%}input[type=range]{width:100%;accent-color:#70944d;min-height:36px;margin:0}output{font-variant-numeric:tabular-nums;text-align:right}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #cfd6c8;padding:7px 10px;border-radius:0;min-height:40px;max-width:100%}button{cursor:pointer}button:hover{background:#f3f6ef}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #73924f;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid #e4e7e1;margin:16px 0 0;padding:14px 0 0}.stats dt{color:#6b7265;font-size:12px}.stats dd{margin:4px 0 0;font-variant-numeric:tabular-nums;font-size:20px;overflow-wrap:anywhere}.seed{font-size:12px;color:#6b7265;margin-left:auto}.matrix-line{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;font-size:14px}.matrix{border-left:1px solid #919a8a;border-right:1px solid #919a8a;border-collapse:collapse;font-variant-numeric:tabular-nums}.matrix td{padding:1px 9px;text-align:right}.mini-heading{font-size:12px;color:#6b7265;margin:4px 0 0}.interval-value{font-size:17px!important}@media(min-width:600px){.controls .slider{flex:1 1 180px;width:auto}.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){h1{font-size:21px}.legend{gap:12px;font-size:12px}button,select{font-size:14px}.stats dd{font-size:18px}}</style></head><body><main>
<h1>Autocorrelation and effective sample size</h1>
<p class="model">정상 AR(1) · f(z) = z<br>Zₜ₊₁ = a Zₜ + √(1−a²) εₜ · εₜ iid~N(0, 1)</p>
<p class="mini-heading">체인의 처음 200개 이하</p><svg id="trace" viewBox="0 0 480 180" role="img" aria-label="정상 AR1 체인의 초기 표본 경로"></svg>
<p class="mini-heading">이론 ACF · ρₖ = aᵏ</p><svg id="acf" viewBox="0 0 480 180" role="img" aria-label="지연에 따른 AR1 이론 자기상관"></svg>
<div class="controls"><div class="slider"><label for="a">a</label><input id="a" type="range" min="-0.9" max="0.95" step="0.05" value="0.8"><output id="a-value" for="a"></output></div><label for="count">표본 수 S</label><select id="count"><option>100</option><option>1000</option><option selected>9000</option><option>20000</option></select><button id="new-seed" type="button">새 경로</button><span class="seed">Seed <output id="seed"></output></span></div>
<dl class="stats four" aria-live="polite"><div><dt>τ = (1+a)/(1−a)</dt><dd id="tau"></dd></div><div><dt>점근 ESS ≈ S/τ</dt><dd id="ess"></dd></div><div><dt>유한 S의 정확한 SE</dt><dd id="finite-se"></dd></div><div><dt>점근 SE ≈ √(τ/S)</dt><dd id="asymptotic-se"></dd></div></dl>
<noscript>이 시연은 JavaScript가 필요합니다.</noscript>
</main><script type="module">
import { ar1Theory, createAr1Sampler } from './sampling-kernel.mjs';
import { samplingSize, samplingNumber, samplingPlot } from './sampling-plot.mjs';
const $=id=>document.getElementById(id);let a=.8,seed=412,sampler=createAr1Sampler({a,seed});
function render(){
 const count=Number($('count').value),s=ar1Theory(a,count),values=sampler.at(count).values.slice(0,200);$('a-value').textContent=a.toFixed(2);$('seed').textContent=seed;$('tau').textContent=samplingNumber(s.tau);$('ess').textContent=s.asymptoticEss.toFixed(1);$('finite-se').textContent=samplingNumber(s.finiteSe);$('asymptotic-se').textContent=samplingNumber(s.asymptoticSe);
 const bound=Math.max(2,Math.ceil(Math.max(...values.map(Math.abs))));samplingPlot($('trace'),{xmin:0,xmax:values.length-1,ymin:-bound,ymax:bound,xTicks:[0,Math.round((values.length-1)/2),values.length-1],yTicks:[-bound,0,bound],series:[{values:values.map((z,t)=>[t,z])}],xLabel:'t'});
 samplingPlot($('acf'),{xmin:0,xmax:30,ymin:-1,ymax:1,xTicks:[0,10,20,30],yTicks:[-1,0,1],bars:s.acf.map((value,k)=>[k,value]),references:[{value:0,dashed:false,color:'#a4ad9c'}],xLabel:'lag k'});requestAnimationFrame(samplingSize);
}
$('a').addEventListener('input',()=>{a=Number($('a').value);sampler=createAr1Sampler({a,seed});render();});$('count').addEventListener('change',render);$('new-seed').addEventListener('click',()=>{seed=(seed+1)>>>0;sampler=createAr1Sampler({a,seed});render();});
new ResizeObserver(samplingSize).observe(document.querySelector('main'));
render();
</script></body></html>
