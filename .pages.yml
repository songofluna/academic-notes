# Pages CMS — GitHub sign-in and repository permissions are handled by Pages CMS.
# https://app.pagescms.org/
media:
  input: assets
  output: assets
  rename: safe

content:
  - name: notes
    label: Study Notes
    type: collection
    path: content/notes
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      fields: [title, course, section, chapter, order, date, draft]
      primary: title
      sort: [order, date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: URL identifier (English, e.g. my-new-note)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: course
        label: Course
        type: reference
        options:
          collection: courses
          search: "title,slug"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: section
        label: Section ID
        type: string
        description: Optional. Use a section ID from the selected course in Courses.
      - name: chapter
        label: Chapter ID
        type: string
        description: Optional. Use a chapter ID from that section in Courses.
      - name: order
        label: Note order
        type: number
        description: Order within the chapter (or section/course when omitted). Lower numbers first; blank goes last.
        options:
          min: 0
      - name: category
        label: Category
        type: select
        options:
          values:
            - name: probability
              label: Probability & Statistics
            - name: generative
              label: Generative Models
            - name: graphs
              label: Graph Learning
            - name: deep-learning
              label: Deep Learning
      - name: summary
        label: Summary
        type: text
      - name: tags
        label: Tags (comma-separated)
        type: string
      - name: draft
        label: Unpublished draft
        type: boolean
      - name: sample
        label: Show "Sample" label
        type: boolean
      - name: body
        label: Article (Markdown, LaTeX)
        type: rich-text
        description: Use Source mode for LaTeX ($...$ or $$...$$) so formatting is preserved.
        options:
          format: markdown
          switcher: true
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, published, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: URL identifier (English)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: summary, label: Summary, type: text }
      - { name: tags, label: "Tags (comma-separated)", type: string }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: featured, label: Featured on home, type: boolean, default: false }
      - name: body
        label: Article (Markdown, LaTeX)
        type: rich-text
        description: Use Source mode for LaTeX ($...$ or $$...$$) and demo shortcodes.
        options:
          format: markdown
          switcher: true
  - name: courses
    label: Courses
    type: collection
    path: content/courses
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: Course ID
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - { name: title, label: Course title, type: string, required: true }
      - { name: order, label: Course order, type: number, options: { min: 0 } }
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: id, label: Section ID, type: string, required: true, pattern: "^[a-z0-9-]+$" }
          - { name: title, label: Section title, type: string, required: true }
          - { name: order, label: Section order, type: number, options: { min: 0 } }
          - name: chapters
            label: Chapters
            type: object
            list:
              collapsible:
                summary: "{fields.title}"
            fields:
              - { name: id, label: Chapter ID, type: string, required: true, pattern: "^[a-z0-9-]+$" }
              - { name: title, label: Chapter title, type: string, required: true }
              - { name: order, label: Chapter order, type: number, options: { min: 0 } }
  - name: site
    label: Home / About settings
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: siteName, label: Site name, type: string }
      - { name: introLabel, label: Intro label, type: string }
      - { name: introTitle, label: Korean heading, type: text }
      - { name: introDescription, label: Introduction, type: text }
      - { name: interests, label: Interests (comma-separated), type: string }
      - { name: heroImage, label: Home image, type: image }
      - { name: heroAlt, label: Image description, type: string }
      - { name: about, label: About, type: text }
      - { name: currentlyStudying, label: Currently studying (comma-separated), type: string }
      - { name: sidebarNote, label: Sidebar note, type: text }
      - { name: contactEmail, label: Contact email, type: string }
      - { name: githubUrl, label: GitHub URL, type: string }
  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: stack, label: Technology, type: string }
      - { name: url, label: Project URL, type: string }
      - { name: sample, label: Sample project, type: boolean }
      - { name: githubUrl, label: GitHub URL, type: string }
      - { name: demoUrl, label: Demo URL, type: string }
      - { name: selected, label: Selected on home, type: boolean, default: false }
